    Documents Sidebar Partial
    
    Displays list of uploaded documents with:
    - Document title and file type
    - Preview of content
    - Delete button
    - Click to select document
    
    TODO: Day 2 Implementation

    - Add search/filter for large lists

<div class="documents-list-items">
    {% if documents %}
        {% for doc in documents %}
        <div class="document-item" data-doc-id="{{ doc.id }}">
            <div class="document-info">
                <div class="document-title">{{ doc.title }}</div>
                <div class="document-type">{{ doc.file_type }}</div>
                <div class="document-preview">{{ doc.content_preview[:80] }}...</div>
            </div>
            <div class="document-actions">
                <button class="btn btn-danger btn-small delete-doc-btn" data-doc-id="{{ doc.id }}">
                    Delete
                </button>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <div class="empty-state">
            <p>No documents yet. Upload one to get started!</p>
        </div>
    {% endif %}
</div>
