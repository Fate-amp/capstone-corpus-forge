<!-- 
    Chat Box Partial
    
    Displays:
    - Chat history (previous Q&A pairs)
    - User input textarea
    - Send button
    - Loading indicator during response generation
    - Streaming response display
    
    TODO: Day 4 Implementation
    - Display chat history with proper formatting
    - Real-time streaming of AI responses
    - Input form submission
    - Loading state UI
    - Error message display
    - Auto-scroll to latest message
    
    Chat format:
    - User messages: right-aligned, blue background
    - AI responses: left-aligned, gray background
    - Timestamps for each message
-->

<div class="chat-history" id="chat-history">
    <!-- 
        TODO: Day 4 - Populate with ChatMessage entries from backend
        
        For each message, show:
        - Query (user message)
        - Response (AI message)
        - Timestamp
        - Token count (optional)
    -->
    <div class="empty-chat-state">
        <p>Select a document and ask a question to get started!</p>
    </div>
</div>

<div class="chat-input-area">
    <form id="chat-form" method="POST" action="{{ url_for('chat') }}">
        <!-- Hidden field for selected document -->
        <input type="hidden" id="selected-doc-id" name="document_id" value="">
        
        <!-- Query textarea -->
        <textarea
            id="chat-input"
            name="query"
            class="chat-input"
            placeholder="Ask a question about the document..."
            rows="2"
            disabled
        ></textarea>
        
        <!-- Send button -->
        <div class="chat-actions">
            <button type="submit" class="btn btn-primary" id="send-btn" disabled>
                Send
            </button>
            <div class="chat-loading hidden" id="chat-loading">
                <span class="spinner"></span>
                <span>Generating response...</span>
            </div>
        </div>
    </form>
</div>

<script>
    // ========================================================================
    // Chat Functionality & Document Selection Integration
    // ========================================================================
    
    console.log('[INIT] Chat box script loading...');
    
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chatHistory = document.getElementById('chat-history');
    const loadingIndicator = document.getElementById('chat-loading');
    const selectedDocIdInput = document.getElementById('selected-doc-id');
    
    console.log('[INIT] DOM elements found:', {
        chatForm: !!chatForm,
        chatInput: !!chatInput,
        sendBtn: !!sendBtn,
        chatHistory: !!chatHistory,
        loadingIndicator: !!loadingIndicator,
        selectedDocIdInput: !!selectedDocIdInput
    });
    
    // ========================================================================
    // Enable/Disable Chat Input Based on Document Selection
    // ========================================================================
    
    /**
     * Update chat input state based on selected document
     */
    function updateChatInputState() {
        const selectedDocId = sessionStorage.getItem('selectedDocId');
        
        if (selectedDocId) {
            // Document is selected - enable input
            chatInput.disabled = false;
            sendBtn.disabled = false;
            selectedDocIdInput.value = selectedDocId;
            chatInput.placeholder = 'Ask a question about the document...';
        } else {
            // No document selected - disable input
            chatInput.disabled = true;
            sendBtn.disabled = true;
            selectedDocIdInput.value = '';
            chatInput.placeholder = 'Select a document first...';
        }
    }
    
    // Check initial state
    updateChatInputState();
    
    // Listen for custom event dispatched when document is selected
    document.addEventListener('documentSelected', updateChatInputState);
    
    // Also listen for storage events (document selection from sidebar)
    window.addEventListener('storage', (e) => {
        if (e.key === 'selectedDocId' || e.key === 'selectedDocTitle') {
            updateChatInputState();
        }
    });
    
    // ========================================================================
    // Chat Form Submission - Full Implementation with Streaming
    // ========================================================================
    
    /**
     * Add a user message to the chat history
     */
    function addUserMessage(message) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'chat-message user';
        
        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        messageDiv.innerHTML = `
            <div class="chat-message-content">
                <div>${escapeHtml(message)}</div>
                <div class="chat-message-time">${timestamp}</div>
            </div>
        `;
        
        chatHistory.appendChild(messageDiv);
        scrollChatToBottom();
        return messageDiv;
    }
    
    /**
     * Add an AI response message (starts empty, will be populated with streaming chunks)
     */
    function addAIMessage() {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'chat-message ai';
        messageDiv.id = 'current-response';
        
        const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        messageDiv.innerHTML = `
            <div class="chat-message-content">
                <div id="response-text"></div>
                <div class="chat-message-time">${timestamp}</div>
            </div>
        `;
        
        chatHistory.appendChild(messageDiv);
        console.log('[DEBUG] AI message added to DOM', messageDiv);
        console.log('[DEBUG] response-text element exists:', !!document.getElementById('response-text'));
        return messageDiv;
    }
    
    /**
     * Append text to the current AI response
     */
    function appendToAIResponse(text) {
        const responseText = document.getElementById('response-text');
        console.log('[DEBUG] appendToAIResponse called with text:', text.substring(0, 50));
        console.log('[DEBUG] response-text element found:', !!responseText);
        
        if (responseText) {
            responseText.textContent += text;
            console.log('[DEBUG] Text appended. Current content:', responseText.textContent.substring(0, 100));
            scrollChatToBottom();
        } else {
            console.error('[ERROR] response-text element not found!');
            console.error('[ERROR] Searching DOM:', document.body.innerHTML.includes('response-text'));
        }
    }
    
    /**
     * Escape HTML to prevent XSS
     */
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    /**
     * Auto-scroll chat to bottom
     */
    function scrollChatToBottom() {
        setTimeout(() => {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }, 0);
    }
    
    /**
     * Clear empty chat state when first message is added
     */
    function clearEmptyState() {
        const emptyState = chatHistory.querySelector('.empty-chat-state');
        if (emptyState) {
            emptyState.remove();
        }
    }
    
    // Handle form submission
    chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const query = chatInput.value.trim();
        const docId = selectedDocIdInput.value;
        
        if (!query || !docId) {
            showNotification('Please select a document and enter a question', 'error');
            return;
        }
        
        // Step 1: Disable input and show loading indicator
        chatInput.disabled = true;
        sendBtn.disabled = true;
        loadingIndicator.classList.remove('hidden');
        
        try {
            // Step 2: Add user message to chat history
            clearEmptyState();
            addUserMessage(query);
            
            // Step 3: Create AI message placeholder
            addAIMessage();
            
            // Step 4: Send POST /chat request with streaming support
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    query: query,
                    document_id: parseInt(docId)
                })
            });
            
            if (!response.ok) {
                throw new Error(`Server error: ${response.status}`);
            }
            
            // Step 5: Read streaming response
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            
            while (true) {
                const { done, value } = await reader.read();
                
                if (done) break;
                
                // Decode chunk and add to buffer
                buffer += decoder.decode(value, { stream: true });
                
                // Process complete messages (lines ending with \n\n)
                const lines = buffer.split('\n\n');
                
                // Keep the last incomplete line in the buffer
                buffer = lines[lines.length - 1];
                
                // Process all complete messages
                for (let i = 0; i < lines.length - 1; i++) {
                    const line = lines[i].trim();
                    
                    if (line.startsWith('data: ')) {
                        // Extract the data part
                        const data = line.substring(6);
                        
                        // Append to the AI response
                        appendToAIResponse(data);
                    }
                }
            }
            
            // Process any remaining data in the buffer
            if (buffer.trim().startsWith('data: ')) {
                const data = buffer.trim().substring(6);
                appendToAIResponse(data);
            }
            
            // Step 6: Clear input and show success
            chatInput.value = '';
            showNotification('Response generated successfully', 'success');
            
        } catch (error) {
            console.error('Chat error:', error);
            
            // Show error message in chat
            const errorDiv = document.createElement('div');
            errorDiv.className = 'chat-message error';
            errorDiv.innerHTML = `
                <div class="chat-message-content" style="background-color: #ffe8e8; color: #d32f2f;">
                    <strong>Error:</strong> ${escapeHtml(error.message)}
                </div>
            `;
            chatHistory.appendChild(errorDiv);
            scrollChatToBottom();
            
            showNotification(`Error: ${error.message}`, 'error');
        } finally {
            // Step 7: Re-enable input and hide loading indicator
            loadingIndicator.classList.add('hidden');
            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatInput.focus();
        }
    });
</script>
